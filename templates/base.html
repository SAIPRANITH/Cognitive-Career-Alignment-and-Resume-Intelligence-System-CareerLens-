<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Career Lens{% endblock %}</title>
    <meta name="description" content="AI-powered resume analysis, job prediction, and career guidance platform using Machine Learning.">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="curtain-open">
    <!-- Page Transition Curtain -->
    <div id="page-curtain"></div>
    
    <!-- Scrolling Background Marquee -->
    <div class="bg-marquee-container">
        <div class="bg-marquee">CAREER LENS AI INTELLIGENCE CAREER LENS AI INTELLIGENCE CAREER LENS AI INTELLIGENCE</div>
    </div>

    <div class="cyber-grid"></div>

    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg glass-nav fixed-top px-4 py-3 z-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Career Lens Logo" width="40" height="40" class="rounded-circle shadow-sm">
                <span class="fs-5 fw-bold brand-text ms-2">Career Lens</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
                <i class="bi bi-list text-primary fs-2"></i>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="topNav">
                <ul class="navbar-nav gap-3 align-items-center">
                    <li class="nav-item">
                        <a href="{{ url_for('dashboard') }}" class="btn nav-primary-btn rounded-pill px-4 shadow-lg position-relative overflow-hidden">
                            <i class="bi bi-file-earmark-check fs-5 me-2"></i> Analyze Resume
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('role_checker_tool') }}" class="btn nav-secondary-btn rounded-pill px-4 shadow-sm">
                            <i class="bi bi-bullseye text-warning me-2"></i> Target Role
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/ai-feedback" class="btn nav-secondary-btn rounded-pill px-4 shadow-sm">
                            <i class="bi bi-robot text-info me-2"></i> AI Feedback
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main role="main">
    {% block body %}{% endblock %}
    </main>

    <!-- Professional Footer -->
    <footer class="mt-auto border-top border-secondary border-opacity-10 py-4" style="background: rgba(6, 11, 20, 0.8); backdrop-filter: blur(10px);">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-4 text-center text-md-start mb-3 mb-md-0">
                    <span class="fw-bold text-gradient">Career Lens</span>
                    <span class="text-muted small ms-2">&copy; 2026</span>
                </div>
                <div class="col-md-4 text-center mb-3 mb-md-0">
                    <span class="text-muted small">AI-Powered Resume Intelligence</span>
                </div>

            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
